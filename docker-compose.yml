# Local development database. Credentials and the host port come from
# backend/backend/.env (see backend/backend/.env.example).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-djnext}
      POSTGRES_USER: ${POSTGRES_USER:-djnext}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djnext}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
