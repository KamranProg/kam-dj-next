
[project]
name = "k-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Kam",email = "kamran.programing@gmail.com"}
]
readme = "README.md"
package-mode = false
requires-python = ">=3.11,<4.0"
dependencies = [
    "django (>=5.2,<6.0)",
    "django-environ (>=0.12.0,<0.13.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "djangorestframework (>=3.16.0,<4.0.0)",
    "django-allauth (>=65.8.0,<66.0.0)",
    "dj-rest-auth (>=7.0.1,<8.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "drf-spectacular[sidecar] (>=0.28.0,<0.29.0)",
    "pillow (>=11.2.1,<12.0.0)",
    "django-cors-headers (>=4.7.0,<5.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
rav = "^0.0.9"
pytest = "^8.3.5"
pytest-django = "^4.11.1"
ruff = "^0.11.13"
mypy = "^1.16.0"
django-stubs = "^5.2.0"
djangorestframework-stubs = "^3.16.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.rav]
yaml_path = "rav.yaml"

[tool.pytest.ini_options]
addopts = "--ds=config.settings -v"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py311"
fix = true
show-fixes = true
preview = true

[tool.ruff.lint]
select = ["ALL"]
exclude = ["migrations", ".venv"]
ignore = [
  "D203",  # conflicting with D211 (docstring style)
  "TRY003",  # Allow implicit exception messages
  "D213", # Allow blank lines after docstring
  "COM812",  # Allow comments on the same line as code
  "E501",  # Ruff should defer to Black for line length enforcement. You should typically disable E501."
  ### Ignored for now, see
  "D100", "D104",       # docstring module/package
  "CPY001",             # copyright
  "TRY002",             # exception class
  "EM101",              # string literal in exception
  "ERA001",             # commented out code
]

[tool.ruff.lint.per-file-ignores]
# Tests
"**/tests/*.py" = ["ARG001", "ARG002", "S106", "PLR6301", "S101", "ANN001", "ANN201"]
"**/test_*.py" = ["ARG001", "ARG002", "S106", "PLR6301", "S101", "ANN001", "ANN201"]

# Views and API
"**/views.py" = ["ARG001", "ARG002"]
"**/urls.py" = ["ARG002", "D101", "D102", "PLR6301"]

# Commands
"*/management/commands/*.py" = ["ANN002", "ANN003", "ARG002", "ANN201", "D102"]

# Migrations
"**/migrations/*.py" = ["E501", "D101", "RUF012"]



[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["mypy_django_plugin.main"]
mypy_path = ["backend"]
exclude = [
  "migrations",
  "backend/.*/migrations/.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
