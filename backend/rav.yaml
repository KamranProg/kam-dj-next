scripts:
  wait-for-db: poetry run python backend/manage.py wait_for_db

  dev: poetry run python backend/manage.py wait_for_db && poetry run python backend/manage.py runserver
  shell: poetry run python backend/manage.py shell
  superuser: poetry run python backend/manage.py createsuperuser

  migrate: poetry run python backend/manage.py migrate
  makemigrations: poetry run python backend/manage.py makemigrations
  
  reset-db: |
    docker rm -f kbackend-db || true
    docker run --name kbackend-db \
      -e POSTGRES_USER=kamran \
      -e POSTGRES_PASSWORD=supersecret \
      -e POSTGRES_DB=kbackend_db \
      -p 5432:5432 \
      -d postgres:15

  clean: |
    find backend -path "*/migrations/*.py" -not -name "__init__.py" -delete
    find backend -path "*/migrations/*.pyc" -delete
    rm -f backend/db.sqlite3

  health: curl http://localhost:8000/api/health/

  test: poetry run python backend/manage.py test core



